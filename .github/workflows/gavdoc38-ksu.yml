name: gavdoc38 Kernel CI
on: [workflow_dispatch]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Download kernels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="gavdoc38/android_kernel_samsung_exynos9810"
          gh release download \
          --repo $REPO \
          --pattern "*starlte*" \
          --dir downloads/starlte
          gh release download \
          --repo $REPO \
          --pattern "*star2lte*" \
          --dir downloads/star2lte
          gh release download \
          --repo $REPO \
          --pattern "*crownlte*" \
          --dir downloads/crownlte
          
      - name: Extract kernels
        run: |
          cd downloads/starlte
          unzip -o "*starlte*.zip"
          cd ../..
          cd downloads/star2lte
          unzip -o "*star2lte*.zip"
          cd ../..
          cd downloads/crownlte
          unzip -o "*crownlte*.zip"
          cd ../..

      - name: Create zip
        run: |
          mkdir -p out/META-INF/com/google/android/
          cp templates/gavdoc38-ksu/update-binary out/META-INF/com/google/android/
          mv downloads/starlte/boot.img ./out/starlte.img
          mv downloads/star2lte/boot.img ./out/star2lte.img
          mv downloads/crownlte/boot.img ./out/crownlte.img
          cd out
          zip -r ../exynos9810_gavdoc38-ksu.zip META-INF starlte.img star2lte.img crownlte.img
          cd ..

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: exynos9810_gavdoc38-ksu
          path: exynos9810_gavdoc38-ksu.zip

      - name: Get timestamp
        id: date
        run: |
          echo "date=$(date +'%d.%m.%Y %H:%M')" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: gavdoc38-ksu_${{ github.run_id }}
          name: "gavdoc38 KernelSU ${{ steps.date.outputs.date }}"
          body: |
            ### KernelSU kernel for LineageOS 24.0 on Exynos 9810
            - Kernel source: https://github.com/gavdoc38/android_kernel_samsung_exynos9810/releases
          files: |
            exynos9810_gavdoc38-ksu.zip
